<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#151516" />
    <meta name="description" content="Plumbline — multilingual grievance intelligence for education, healthcare and public services." />
    <title>Plumbline · Grievance Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/plumb.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&family=Noto+Sans+Telugu:wght@400..700&family=Noto+Sans+Devanagari:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('plb-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
